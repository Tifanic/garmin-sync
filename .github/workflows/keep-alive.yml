name: Keep Alive

on:
  schedule:
    # Every Sunday at 3:00 UTC (11:00 Beijing time)
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update timestamp and push
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-active.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-active.txt
          git commit -m "chore: keep repository active [skip ci]" || echo "No changes"
          git push
